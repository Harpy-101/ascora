spring:
  application:
    name: api

  datasource:
    url: jdbc:postgresql://localhost:5433/ascora
    username: ascora
    password: ascora

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${BETTER_AUTH_ISSUER:http://172.20.10.2:3005}
          jwk-set-uri: ${BETTER_AUTH_JWKS_URI:http://172.20.10.2:3005/api/auth/jwks}
          audiences: ${ASCORA_API_AUDIENCE:http://172.20.10.2:8080}
  logging:
    level:
      org.springframework.security: TRACE
      org.springframework.security.oauth2: TRACE

server:
  port: 8080

ascend-db:
  base-url: https://edb-with-videos-and-images-by-ascendapi.p.rapidapi.com/api/v1
  rapidapi-host: edb-with-videos-and-images-by-ascendapi.p.rapidapi.com
  api-key: ${ASCEND_DB_API_KEY}
