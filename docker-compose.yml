services:
  postgres:
    image: postgres:16
    container_name: ascora-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ascora
      POSTGRES_USER: ascora
      POSTGRES_PASSWORD: ascora
    volumes:
      - ascora_postgres_data:/var/lib/postgresql/data

volumes:
  ascora_postgres_data:
